appId: com.klima.tpv
productName: Klima TPV
directories:
  output: dist/tpv
files:
  - main.js
  - preload.js
  - icon.ico
  - package.json
  - "!dist/**"
extraResources:
  - from: config.tpv.json
    to: config.json
protocols:
  name: Klima Auth
  schemes:
    - klima
win:
  icon: icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
  artifactName: Klima-TPV-Setup-${version}.${ext}
  shortcutName: Klima TPV
electronDownload:
  cache: .electron-cache
