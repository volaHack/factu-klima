# =============================================================================
# Nginx — Reverse proxy para klimafacturas.com
# =============================================================================
# Copiar a:  /etc/nginx/sites-available/facturacion-app
# Activar:   sudo ln -s /etc/nginx/sites-available/facturacion-app /etc/nginx/sites-enabled/
# Probar:    sudo nginx -t
# Recargar:  sudo systemctl reload nginx
#
# SSL gestionado por Certbot (Let's Encrypt) — se configura con:
#   sudo certbot --nginx -d klimafacturas.com -d www.klimafacturas.com
# =============================================================================

# Redirigir HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name klimafacturas.com www.klimafacturas.com;

    # Certbot necesita este bloque para verificar el dominio
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Reverse proxy a Node.js :3000
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name klimafacturas.com www.klimafacturas.com;

    # ─── SSL (Certbot los genera automáticamente) ───
    ssl_certificate     /etc/letsencrypt/live/klimafacturas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/klimafacturas.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ─── Seguridad ───
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # ─── Tamaño máximo de subida (certificados Verifactu, etc.) ───
    client_max_body_size 50M;

    # ─── Proxy a Next.js ───
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Headers reales para que Next.js sepa la IP y el protocolo
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;

        # Timeouts generosos para operaciones largas (generación PDF, etc.)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ─── Caché de estáticos de Next.js ───
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # ─── Archivos públicos ───
    location /favicon.ico {
        proxy_pass http://127.0.0.1:3000;
        expires 30d;
    }
}
